<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — SSEMS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-body d-flex align-items-center justify-content-center">
  <div class="card login-card shadow">
    <div class="card-body p-4">
      <h4 class="mb-1">🔒 Secure Smart Environment Monitoring System</h4>
      <p class="text-muted small mb-4">Authorized access only. All login attempts are logged.</p>
      {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}
      <form method="POST" action="{{ url_for('views.login_page') }}">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required maxlength="50" autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required maxlength="128">
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <p class="text-muted small mt-3 mb-0">
        Default demo account: <code>admin</code> / <code>ChangeMe!123</code>
        — change immediately after first login.
      </p>
    </div>
  </div>
</body>
</html>
