<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SSEMS{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('views.dashboard_page') }}">🔒 SSEMS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('views.dashboard_page') }}">Overview</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('views.sensors_page') }}">Sensor Data</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('views.devices_page') }}">Devices</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('views.alerts_page') }}">Alerts &amp; Logs</a></li>
        {% if role == 'admin' %}
        <li class="nav-item"><a class="nav-link" href="{{ url_for('views.users_page') }}">Users</a></li>
        {% endif %}
      </ul>
      <span class="navbar-text me-3">
        {{ username }} <span class="badge bg-secondary">{{ role }}</span>
      </span>
      <a class="btn btn-outline-light btn-sm" href="{{ url_for('views.logout') }}">Logout</a>
    </div>
  </div>
</nav>
<div class="container-fluid py-4">
  {% if forbidden_notice %}
    <div class="alert alert-warning">{{ forbidden_notice }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
